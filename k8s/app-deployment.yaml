apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-c-app
  template:
    metadata:
      labels:
        app: service-c-app
    spec:
      containers:
        - name: service-c-app
          image: ranggaadithia/service-c-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80   # nginx listen port inside container
          env:
            - name: DB_HOST
              value: service-c-db
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: stock-db
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              value: postgres
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service-c-app
spec:
  selector:
    app: service-c-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 8002  # expose ke host port 8002
  type: NodePort
